target_sim_node:
  ros__parameters:
    initial_position: [0.0, 0.0, 0.0]
    initial_velocity: [10.0, 0.0, 30.0]   # ~45 deg launch in the x-z plane
    gravity: 9.81
    update_rate: 50.0
    loop: true

radar_sensor_node:
  ros__parameters:
    noise_stddev: 0.5    # meters of Gaussian noise on each axis
    update_rate: 10.0    # radar is slower than the sim (measurements are sparse)
