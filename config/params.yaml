target_sim_node:
  ros__parameters:
    initial_position: [0.0, 0.0, 0.0]
    initial_velocity: [10.0, 0.0, 30.0]   # ~45 deg launch in the x-z plane
    gravity: 9.81
    update_rate: 50.0
    loop: true

radar_sensor_node:
  ros__parameters:
    noise_stddev: 0.5    # meters of Gaussian noise on each axis
    update_rate: 10.0    # radar is slower than the sim (measurements are sparse)

estimator_node:
  ros__parameters:
    measurement_stddev: 0.5   # how noisy we believe the radar is (matches above)
    process_noise: 1.0        # trust in the ballistic model (lower = smoother)
    gravity: 9.81
    reinit_distance: 8.0      # measurement further than this from the estimate
                              # means the target restarted -> reset the filter

interceptor_node:
  ros__parameters:
    launch_position: [50.0, 10.0, 0.0]
    speed: 40.0          # m/s, must beat the target (~31 m/s at launch)
    gravity: 9.81        # used to roll the target's state forward
    update_rate: 50.0
