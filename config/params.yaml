# The scenery: ground plane, city, radar tower, launcher pad.
# Keep radar_position / launcher_position in sync with the radar static
# transform in the launch file and with interceptor_node.launch_position.
world_node:
  ros__parameters:
    ground_size: 200.0
    radar_position: [30.0, 0.0]
    launcher_position: [40.0, 10.0]

target_sim_node:
  ros__parameters:
    initial_position: [0.0, 0.0, 0.0]
    # Nominal shot: with g = 9.81 the flight lasts 2*vz/g = 4.9 s and lands
    # at vx * 4.9 = 64 m, i.e. right on the city. The target is aimed at
    # what we are defending, which is the whole point of the scenario.
    initial_velocity: [13.0, 0.0, 24.0]
    # Each new target is drawn in initial_velocity +/- this, per axis. Kept
    # narrow on purpose: the arcs still differ every time (impacts land
    # between x = 45 and x = 85, so some fall short and some overshoot the
    # city) but every target remains a credible threat to it.
    velocity_spread: [2.5, 2.0, 3.0]
    gravity: 9.81
    update_rate: 50.0
    loop: true
    trail_step: 0.5      # store a trail point every this many metres
    relaunch_delay: 2.5  # empty-sky pause between one target and the next,
                         # so the engagements do not run into each other

radar_sensor_node:
  ros__parameters:
    noise_stddev: 0.5    # meters of Gaussian noise on each axis
    update_rate: 10.0    # radar is slower than the sim (measurements are sparse)
    max_target_age: 0.2  # ignore tf readings older than this: with nothing in
                         # the sky the radar must report nothing, not the last
                         # position it saw (tf2 keeps serving that from cache)

estimator_node:
  ros__parameters:
    measurement_stddev: 0.5   # how noisy we believe the radar is (matches above)
    process_noise: 1.0        # trust in the ballistic model (lower = smoother)
    gravity: 9.81
    reinit_distance: 8.0      # measurement further than this from the estimate
                              # means the target restarted -> reset the filter

interceptor_node:
  ros__parameters:
    # The pad stands in front of the city (which starts at x = 58), so the
    # interceptor flies up-range towards the incoming target and the kill
    # happens before the target is over what we are protecting.
    launch_position: [40.0, 10.0, 0.0]
    speed: 45.0          # m/s, faster than the target but not by so much
                         # that the interception always succeeds
    hit_radius: 2.0      # proximity fuze: distance to ground truth that
                         # counts as a hit (also covers the 50 Hz motion steps)
    gravity: 9.81        # used to roll the target's state forward
    update_rate: 50.0
    # Threat evaluation: engage only targets predicted to land within
    # defend_radius of defend_center, which is the middle of the city
    # (the skyline spans x = 55..83). Targets falling short or wide are
    # deliberately left alone -- watch for the HOLD line in the log.
    defend_center: [69.0, -3.0]
    defend_radius: 18.0
    decision_delay: 0.6  # give the filter this long to converge before
                         # trusting its predicted impact enough to decide on
    max_flight_time: 0.7 # seconds of fuel. At 45 m/s that is ~31 m of reach,
                         # about the median engagement: the closer shots
                         # connect, the longer ones burn out and fly home.
    cooldown: 1.5        # seconds to reload after a shot. Together with the
                         # fuel this sets the difficulty: the interceptor
                         # gets ~1 extra salvo per target, so roughly one
                         # target in nine survives long enough to land and
                         # you get to see the ground explosion.
    trail_step: 0.5      # store a trail point every this many metres
